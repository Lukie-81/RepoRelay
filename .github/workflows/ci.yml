name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      REPORELAY_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Resolve canonical workspace
        id: canonical_workspace
        run: node scripts/resolve-canonical-workspace.mjs

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=low

      - name: Verify release
        env:
          REPORELAY_ALLOWED_ROOTS: ${{ steps.canonical_workspace.outputs.path }}
        run: npm run verify:release

      - name: Check whitespace
        run: git diff --check

      - name: Doctor
        env:
          REPORELAY_ALLOWED_ROOTS: ${{ steps.canonical_workspace.outputs.path }}
          REPORELAY_HOST: 127.0.0.1
          REPORELAY_BRIDGE_AUTH: "1"
          REPORELAY_BRIDGE_SECRET: "reporelay-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"
          REPORELAY_ALLOWED_HOSTS: 127.0.0.1
        run: node dist/cli.js doctor

  site:
    name: Verify GitHub Pages site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Checkout GitHub Pages source
        uses: actions/checkout@v4
        with:
          repository: Lukie-81/RepoRelay
          ref: gh-pages
          path: site

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0

      - name: Audit site metadata and source facts
        working-directory: source
        env:
          REPORELAY_SITE_ROOT: ${{ github.workspace }}/site
          REPORELAY_SOURCE_ROOT: ${{ github.workspace }}/source
        run: npm run seo:audit
